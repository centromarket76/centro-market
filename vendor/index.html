<!-- PROJECT: CENTRO MARKET | FILE: vendor/index.html | VERSION: 1.0.0 | LAST UPDATED: 2026-11-11 | PURPOSE: Vendor PWA (register, login, dashboard, products with photos and stock, store settings) | CHANGELOG: 1.0.0 Initial version (Batch 3) -->
<!doctype html>
<html lang="en" data-t="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro Market Vendor</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#b45309">
<style>
:root{--bg:#f7f5f2;--cd:#fff;--tx:#201a14;--mu:#6b625a;--bd:#e5dfd8;--pr:#b45309;--pt:#fff;--dn:#b42318;--ok:#067647;--wn:#b54708}
:root[data-t=dark]{--bg:#16120e;--cd:#211b16;--tx:#f1ebe4;--mu:#a89e94;--bd:#38302a;--pr:#f59e0b;--pt:#2a1800;--dn:#f97066;--ok:#47cd89;--wn:#fdb022}
@media(prefers-color-scheme:dark){:root[data-t=system]{--bg:#16120e;--cd:#211b16;--tx:#f1ebe4;--mu:#a89e94;--bd:#38302a;--pr:#f59e0b;--pt:#2a1800;--dn:#f97066;--ok:#47cd89;--wn:#fdb022}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:8px 12px}header b{color:var(--pr);margin-right:auto}
nav{display:flex;gap:4px;background:var(--cd);border-bottom:1px solid var(--bd);padding:6px 8px;position:sticky;top:49px;z-index:4}nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 6px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--pr);color:var(--pt)}
main{max-width:980px;margin:0 auto;padding:14px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat small{color:var(--mu)}.stat b{display:block;font-size:21px}
h2{margin:4px 0 12px;font-size:18px}h3{margin:0 0 8px;font-size:15px}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}input[type=checkbox]{width:auto}
.b{background:var(--pr);color:var(--pt);border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;margin:2px}.g{background:none;color:var(--tx);border:1px solid var(--bd)}.d{background:var(--dn);color:#fff}button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.mu{color:var(--mu)}.empty{padding:22px;text-align:center;color:var(--mu)}.ck{display:flex;gap:6px;align-items:center;margin:4px 0;color:var(--tx);font-size:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd);margin-right:4px}.ACTIVE,.APPROVED,.AVAILABLE,.TRIAL{color:var(--ok)}.PENDING,.SOLD_OUT{color:var(--wn)}.REJECTED,.SUSPENDED,.HIDDEN,.ARCHIVED{color:var(--dn)}
.pc{display:flex;gap:12px}.pc img,.ph{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--bd);flex:none}.pc>div{flex:1;min-width:0}.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.imgs div{text-align:center}.imgs img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.note{border-left:4px solid var(--wn);background:var(--cd);padding:10px 12px;border-radius:8px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}#toast.e{background:var(--dn);color:#fff}.box{max-width:430px;margin:5vh auto;padding:0 14px}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script>
'use strict';
const DEFAULT_API=''; // optional: paste your Web app URL (ending /exec); otherwise the app asks once and remembers it
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=localStorage,ss=sessionStorage,R=()=>'r'+crypto.randomUUID().replace(/-/g,''),dev=ls.cv_dev||(ls.cv_dev=crypto.randomUUID().replace(/-/g,''));
let API=ls.cm_api||DEFAULT_API,tok=ss.cv_tok||'',me=null,view='dash',mode='login',C={cats:[],prods:[],edit:null};
const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),dt=s=>s?new Date(s).toLocaleDateString('en-PH',{dateStyle:'medium'}):'';
const tag=s=>s?`<span class="tag ${esc(s)}">${esc(String(s).replace('_',' '))}</span>`:'',el=(f,n)=>f.elements[n];
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',e?6000:2600)}
async function api(action,payload){let j;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload:payload||{},token:tok||null,requestId:R(),deviceId:dev})});j=await r.json()}
 catch(e){throw{message:navigator.onLine?'Cannot reach the server. Check the Web app URL and your connection.':'You are offline. Changes cannot be saved offline.'}}
 if(!j||!j.ok){const er=(j&&j.error)||{message:'Unexpected reply from the server. Is this the Centro Market Web app URL?'};if(er.code==='UNAUTHENTICATED'&&tok&&action!=='vendor.me'){tok='';ss.removeItem('cv_tok');mode='login';toast('Session expired. Please log in again.',1);boot()}throw er}return j.data}
async function run(fn){try{await fn()}catch(e){console.error(e);toast((e&&(e.message||e.code))||String(e)||'Something went wrong',1)}}
const fld=(n,l,t,x)=>`<label>${l}</label><input name="${n}" type="${t||'text'}" ${x||''}>`,card=(h,t)=>`<div class="box"><div class="card"><h2>${t}</h2>${h}</div></div>`;

async function boot(){
 if(!API)return $('#app').innerHTML=card(`<form data-f="connect">${fld('url','Web app URL (ends with /exec)','url','required placeholder="https://script.google.com/macros/s/…/exec"')}<p class="mu">Saved on this device only.</p><button class="b" style="width:100%">Continue</button></form>`,'Connect to Centro Market');
 if(!C.cats.length)try{C.cats=(await api('system.categories')).categories}catch(e){toast(e.message,1)}
 if(!tok)return auth();
 try{me=await api('vendor.me')}catch(e){tok='';ss.removeItem('cv_tok');return auth()}
 shell();render()}
function auth(){const L=mode==='login';
 $('#app').innerHTML=`<div class="box"><div class="card"><div class="row"><button class="b ${L?'':'g'}" data-a="mode" data-id="login">Log in</button><button class="b ${L?'g':''}" data-a="mode" data-id="register">Register store</button></div></div>`+(L?card(`<form data-f="login">${fld('mobile','Mobile number','tel','required autocomplete="username"')}${fld('pw','Password','password','required autocomplete="current-password"')}<button class="b" style="width:100%;margin-top:12px">Log in</button></form><p class="mu"><a href="#" data-a="resetapi">Change server URL</a></p>`,'Vendor login'):
 card(`<form data-f="register"><p class="mu">Your store is reviewed by the marketplace admin before it goes public.</p>${fld('fullName','Your full name','text','required maxlength="100"')}${fld('storeName','Store name','text','required maxlength="80"')}${fld('stall','Market / stall location','text','required maxlength="120"')}${fld('mobile','Mobile number','tel','required')}${fld('email','Email (optional)','email')}
 <label>What do you sell? (choose at least one)</label>${C.cats.map(c=>`<label class="ck"><input type="checkbox" name="cat" value="${esc(c.CategoryID)}"> ${esc(c.Name)}</label>`).join('')}
 ${fld('fb','Facebook page link (optional)','url','placeholder="https://facebook.com/…"')}${fld('msg','Messenger link (optional)','url','placeholder="https://m.me/…"')}${fld('gname','GCash account name (optional)')}${fld('gnum','GCash number (optional)','tel')}
 <label>About your store (optional)</label><textarea name="desc" rows="3" maxlength="500"></textarea>${fld('pw','Password (8+ characters, letters and numbers)','password','required autocomplete="new-password"')}<button class="b" style="width:100%;margin-top:12px">Submit application</button></form>`,'Register your store'))+'</div>'}
function shell(){const v=me.vendor,T=[['dash','Dashboard'],['prods','Products'],['store','Store']];
 $('#app').innerHTML=`<header><b>${esc(v.StoreName)}</b>${tag(v.Status)}<button class="b g" data-a="theme">Theme</button><button class="b g" data-a="logout">Log out</button></header><nav>${T.map(t=>`<button data-a="tab" data-id="${t[0]}" class="${t[0]===view?'on':''}">${t[1]}</button>`).join('')}</nav><main id="view"></main>`}
async function render(){const v=$('#view');v.innerHTML='<div class="empty">Loading…</div>';try{v.innerHTML=await V[view]();if(view==='prods')fillEdit()}catch(e){v.innerHTML=`<div class="card"><b>Could not load.</b> ${esc(e.message)}</div>`}}
const banner=()=>{const v=me.vendor,s=v.Status;return s==='ACTIVE'?'':`<div class="note"><b>${s==='PENDING'?'Waiting for admin approval':s==='REJECTED'?'Application not approved':'Store not active'}</b><br>${s==='PENDING'?'You can complete your store profile now. Adding products opens when the admin approves your store.':esc(v.RejectReason||'Please contact the marketplace admin.')}</div>`};
const live=()=>me.vendor.Status==='ACTIVE';

const V={
async dash(){const d=await api('vendor.dashboard'),S=(l,x,s)=>`<div class="stat"><small>${l}</small><b>${x}</b><small>${s||''}</small></div>`,sub=d.subscription;
 return `<h2>Dashboard</h2>${banner()}<div class="grid">${S('Store',esc(d.storeStatus))}${S('Active products',d.products.active,'of '+(sub&&sub.ProductLimit||'—')+' allowed')}${S('Waiting for approval',d.products.byApproval.PENDING||0)}${S('Sold out',d.products.soldOut)}${S('Subscription',sub?esc(sub.Status):'—',sub?esc(sub.PlanName)+' · until '+dt(sub.ExpiresAt):'Starts when approved')}${S('Orders',d.orders.total)}${S('Sales today',peso(d.salesToday))}</div>
 <div class="card"><h3>Low stock</h3>${d.lowStock.length?d.lowStock.map(x=>`<div>${esc(x.Name)} — <b>${x.OnHand}</b> left</div>`).join(''):'<span class="mu">Nothing running low.</span>'}</div><p class="mu">Orders, sales reports and promotions arrive in the next batches.</p>`},
async prods(){const d=await api('vendor.listProducts');C.prods=d.products;if(!live())return `<h2>Products</h2>${banner()}`;
 const u=['kg','500 g','piece','pack','bundle','liter','bottle','dozen'].map(x=>`<option>${x}</option>`).join('');
 return `<h2>Products</h2>${banner()}<div class="card"><h3 id="pt">Add product</h3><form data-f="prod"><input type="hidden" name="id"><div class="row"><div>${fld('name','Product name','text','required maxlength="100"')}</div><div><label>Category</label><select name="cat">${C.cats.map(c=>`<option value="${esc(c.CategoryID)}">${esc(c.Name)}</option>`).join('')}</select></div></div>
 <div class="row"><div>${fld('price','Price (₱)','number','required min="0.01" step="0.01"')}</div><div>${fld('unit','Unit','text','required list="ul" maxlength="20" value="kg"')}<datalist id="ul">${u}</datalist></div><div>${fld('stock','Stock on hand','number','min="0" step="any" value="0"')}</div></div>
 <div class="row"><div>${fld('minOrder','Min order (optional)','number','min="0" step="any"')}</div><div>${fld('maxOrder','Max order (optional)','number','min="0" step="any"')}</div><div><label>Discount</label><select name="dtype"><option value="NONE">None</option><option value="PERCENT">Percent %</option><option value="FIXED">Fixed ₱</option></select></div><div>${fld('dval','Discount value','number','min="0" step="0.01"')}</div></div>
 <label class="ck"><input type="checkbox" name="dec" checked> Sold by weight / decimal quantities allowed (e.g. 0.5 kg)</label><label>Description (optional)</label><textarea name="desc" rows="2" maxlength="500"></textarea>
 <div id="ph" class="mu">Save the product first, then add photos.</div><button class="b" style="margin-top:10px">Save product</button> <button type="button" class="b g" data-a="pnew">Clear</button></form></div>
 <div class="card">${C.prods.length?C.prods.map(p=>`<div class="pc" style="margin-bottom:14px">${p.PrimaryImageUrl?`<img src="${esc(p.PrimaryImageUrl)}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(p.Name)}</b> · ${peso(p.Price)}/${esc(p.Unit)}${p.DiscountType!=='NONE'?' <span class="mu">(−'+p.DiscountValue+(p.DiscountType==='PERCENT'?'%':'₱')+')</span>':''}<br>${tag(p.ApprovalStatus)}${tag(p.Availability)}${p.Status!=='ACTIVE'?tag(p.Status):''}<span class="mu"> Stock: <b>${p.OnHand}</b></span><br>
 <button class="b g" data-a="pedit" data-id="${esc(p.ProductID)}">Edit</button><button class="b g" data-a="pstock" data-id="${esc(p.ProductID)}">Stock</button>${p.Status==='ACTIVE'?(p.Availability==='AVAILABLE'?`<button class="b g" data-a="pstate" data-id="${esc(p.ProductID)}" data-d="SOLD_OUT">Sold out</button><button class="b g" data-a="pstate" data-id="${esc(p.ProductID)}" data-d="HIDDEN">Hide</button>`:`<button class="b" data-a="pstate" data-id="${esc(p.ProductID)}" data-d="AVAILABLE">Make available</button>`)+`<button class="b d" data-a="pstate" data-id="${esc(p.ProductID)}" data-d="ARCHIVE">Archive</button>`:`<button class="b" data-a="pstate" data-id="${esc(p.ProductID)}" data-d="RESTORE">Restore</button>`}</div></div>`).join(''):'<div class="empty">No products yet. Add your first product above.</div>'}</div>`},
async store(){const v=(await api('vendor.me')).vendor;me.vendor=v;const D=['mon','tue','wed','thu','fri','sat','sun'],h=v.OperatingHours||{},ck=(n,l,x)=>`<label class="ck"><input type="checkbox" name="${n}" ${x?'checked':''}> ${l}</label>`;
 return `<h2>Store</h2>${banner()}<div class="card"><form data-f="store"><h3>Profile</h3><div class="row"><div>${fld('storeName','Store name','text',`required maxlength="80" value="${esc(v.StoreName)}"`)}</div><div>${fld('fullName','Owner name','text',`required maxlength="100" value="${esc(v.FullName)}"`)}</div></div>${fld('stall','Stall location','text',`required maxlength="120" value="${esc(v.StallLocation)}"`)}${fld('email','Email','email',`value="${esc(v.Email)}"`)}
 ${fld('fb','Facebook page link','url',`value="${esc(v.FacebookPage)}"`)}${fld('msg','Messenger link','url',`value="${esc(v.MessengerLink)}"`)}<div class="row"><div>${fld('gname','GCash account name','text',`value="${esc(v.GcashName)}"`)}</div><div>${fld('gnum','GCash number','tel',`value="${esc(v.GcashNumber)}"`)}</div></div><label>About your store</label><textarea name="desc" rows="3" maxlength="500">${esc(v.Description)}</textarea>
 <label>Product categories</label>${C.cats.map(c=>`<label class="ck"><input type="checkbox" name="cat" value="${esc(c.CategoryID)}" ${(v.Categories||[]).includes(c.CategoryID)?'checked':''}> ${esc(c.Name)}</label>`).join('')}
 <h3 style="margin-top:16px">Selling options</h3>${ck('isOpen','Store is open now',v.IsOpen)}${ck('pickup','Pickup',v.PickupEnabled)}${ck('delivery','Local delivery',v.DeliveryEnabled)}${ck('reserve','Reserve for later pickup',v.ReservationEnabled)}${ck('cash','Accept cash',v.AcceptCash)}${ck('gcash','Accept GCash',v.AcceptGcash)}${ck('utang','Offer utang (credit, you approve each one)',v.UtangEnabled)}
 <div class="row"><div>${fld('fee','Delivery fee (₱)','number',`min="0" step="0.01" value="${v.DeliveryFee||0}"`)}</div><div>${fld('minAmt','Minimum order (₱)','number',`min="0" step="0.01" value="${v.MinOrderAmount||0}"`)}</div><div>${fld('km','Max delivery distance (km)','number',`min="0" step="any" value="${v.MaxDeliveryKm||0}"`)}</div><div>${fld('prep','Preparation time (min)','number',`min="0" step="1" value="${v.PrepMinutes||0}"`)}</div></div>
 <h3 style="margin-top:16px">Operating hours</h3>${D.map(d=>{const x=h[d]||{open:'06:00',close:'17:00',closed:false};return `<div class="row" style="align-items:center"><b style="flex:0 0 44px">${d.toUpperCase()}</b><input type="time" name="o_${d}" value="${esc(x.open)}"><input type="time" name="c_${d}" value="${esc(x.close)}"><label class="ck"><input type="checkbox" name="x_${d}" ${x.closed?'checked':''}> Closed</label></div>`}).join('')}
 <button class="b" style="margin-top:14px">Save store</button></form></div>`}};

const H={
async connect(f){const u=el(f,'url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/\s]+\/exec$/.test(u))throw{message:'Paste the full Web app URL ending in /exec.'};ls.cm_api=API=u;boot()},
async login(f){const d=await api('auth.login',{mobile:el(f,'mobile').value,password:el(f,'pw').value});tok=d.token;if(d.user.Role!=='VENDOR'){await api('auth.logout').catch(()=>{});tok='';throw{message:'This is not a vendor account.'}}ss.cv_tok=tok;boot()},
async register(f){const ids=[...f.querySelectorAll('input[name=cat]:checked')].map(x=>x.value);if(!ids.length)throw{message:'Choose at least one product category.'};
 const d=await api('vendor.register',{fullName:el(f,'fullName').value,storeName:el(f,'storeName').value,stallLocation:el(f,'stall').value,mobile:el(f,'mobile').value,email:el(f,'email').value,categoryIds:ids,facebookPage:el(f,'fb').value,messengerLink:el(f,'msg').value,gcashName:el(f,'gname').value,gcashNumber:el(f,'gnum').value,description:el(f,'desc').value,password:el(f,'pw').value});
 tok=ss.cv_tok=d.token;toast('Application submitted. The admin will review your store.');boot()},
async prod(f){const g=n=>el(f,n).value,d=await api('vendor.saveProduct',{productId:g('id')||undefined,name:g('name'),categoryId:g('cat'),description:g('desc'),price:g('price'),unit:g('unit'),allowDecimal:el(f,'dec').checked,stock:g('stock'),minOrder:g('minOrder'),maxOrder:g('maxOrder'),discountType:g('dtype'),discountValue:g('dval')});
 toast(d.resubmitted?'Saved. The change needs admin approval again.':'Product saved');C.edit=d.product.ProductID;await render()},
async store(f){const g=n=>el(f,n).value,c=n=>el(f,n).checked,ids=[...f.querySelectorAll('input[name=cat]:checked')].map(x=>x.value),oh={};
 ['mon','tue','wed','thu','fri','sat','sun'].forEach(d=>oh[d]={open:g('o_'+d),close:g('c_'+d),closed:c('x_'+d)});
 const d=await api('vendor.updateStore',{storeName:g('storeName'),fullName:g('fullName'),stallLocation:g('stall'),email:g('email'),facebookPage:g('fb'),messengerLink:g('msg'),gcashName:g('gname'),gcashNumber:g('gnum'),description:g('desc'),categoryIds:ids,
  isOpen:c('isOpen'),pickupEnabled:c('pickup'),deliveryEnabled:c('delivery'),reservationEnabled:c('reserve'),acceptCash:c('cash'),acceptGcash:c('gcash'),utangEnabled:c('utang'),deliveryFee:g('fee'),minOrderAmount:g('minAmt'),maxDeliveryKm:g('km'),prepMinutes:g('prep'),operatingHours:oh});
 me.vendor=d.vendor;toast('Store saved');shell();render()}};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const b=f.querySelector('button:not([type=button])');b.disabled=true;run(()=>H[f.dataset.f](f)).finally(()=>b.disabled=false)});

function fillEdit(){const p=C.prods.find(x=>x.ProductID===C.edit),f=document.querySelector('form[data-f=prod]');if(!f)return;if(!p){return}
 const s=(n,v)=>el(f,n).value=v==null?'':v;s('id',p.ProductID);s('name',p.Name);s('cat',p.CategoryID);s('desc',p.Description);s('price',p.Price);s('unit',p.Unit);s('stock',p.OnHand);s('minOrder',p.MinOrder);s('maxOrder',p.MaxOrder);s('dtype',p.DiscountType);s('dval',p.DiscountValue||'');el(f,'dec').checked=!!p.AllowDecimal;$('#pt').textContent='Edit product';
 $('#ph').innerHTML=`<label>Photos (up to 5, first one is the main photo)</label><div class="imgs">${p.Images.map(i=>`<div><img src="${esc(i.Url)}" alt="">${i.IsPrimary?'<small class="mu">Main</small><br>':''}<button type="button" class="b d" data-a="imgdel" data-id="${esc(i.ImageID)}">Remove</button></div>`).join('')}</div>${p.Images.length<5?'<input type="file" id="imgf" accept="image/jpeg,image/png,image/webp">':'<span class="mu">Photo limit reached.</span>'}`}
function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 let q=.85,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length>900000&&q>.2);ok(d.split(',')[1])};im.onerror=()=>no({message:'That file is not a readable image.'});im.src=u})}
document.addEventListener('change',e=>{if(e.target.id!=='imgf'||!e.target.files[0])return;const file=e.target.files[0];run(async()=>{toast('Uploading photo…');const b64=await shrink(file);await api('vendor.uploadImage',{productId:C.edit,dataBase64:b64});toast('Photo added');await render()})});

const A={
tab(id){view=id;shell();render()},mode(id){mode=id;auth()},theme(){const o=['system','light','dark'],h=document.documentElement;h.dataset.t=o[(o.indexOf(h.dataset.t)+1)%3];ls.cv_theme=h.dataset.t;toast('Theme: '+h.dataset.t)},
async logout(){await api('auth.logout').catch(()=>{});tok='';ss.removeItem('cv_tok');C.edit=null;mode='login';boot()},resetapi(){ls.removeItem('cm_api');API=DEFAULT_API;boot()},
pedit(id){C.edit=id;fillEdit();scrollTo({top:0,behavior:'smooth'})},pnew(){C.edit=null;const f=document.querySelector('form[data-f=prod]');f.reset();el(f,'id').value='';$('#pt').textContent='Add product';$('#ph').textContent='Save the product first, then add photos.'},
async pstate(id,d){if(d==='ARCHIVE'&&!confirm('Archive this product? It will be hidden from customers.'))return;await api('vendor.setProductState',{productId:id,action:d});toast('Updated');render()},
async pstock(id){const p=C.prods.find(x=>x.ProductID===id),n=prompt('New stock on hand for '+p.Name+':',p.OnHand);if(n===null)return;await api('vendor.setStock',{productId:id,onHand:n});toast('Stock updated');render()},
async imgdel(id){if(!confirm('Remove this photo?'))return;await api('vendor.deleteImage',{imageId:id});toast('Photo removed');render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;e.preventDefault();run(()=>A[b.dataset.a](b.dataset.id,b.dataset.d))});
addEventListener('offline',()=>toast('You are offline. Changes cannot be saved offline.',1));
if(ls.cv_theme)document.documentElement.dataset.t=ls.cv_theme;
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>
